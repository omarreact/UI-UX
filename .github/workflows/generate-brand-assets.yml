name: Generate first-party brand raster assets
on:
  push:
    branches: [brand/softly-complete-identity]
    paths:
      - "src/brand/**"
      - ".github/workflows/generate-brand-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-brand-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SVG renderer (build tooling only)
        run: python -m pip install --disable-pip-version-check "cairosvg==2.7.1"
      - name: Produce branded PNG social and app icons
        run: python src/brand/make-assets.py
      - name: Validate generated sizes
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          images = {
            "social-card.png": (1200, 630),
            "icon-192.png": (192, 192),
            "icon-512.png": (512, 512),
            "apple-touch-icon.png": (180, 180)
          }
          for name, expected in images.items():
              content = (Path("assets/brand") / name).read_bytes()
              assert content[:8] == b"\x89PNG\r\n\x1a\n", name
              assert struct.unpack(">II", content[16:24]) == expected, name
              print(name, len(content), expected)
          PY
      - name: Commit self-hosted raster exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/*.png
          if ! git diff --cached --quiet; then
            git commit -m "build: add optimized Softly brand PNG exports"
            git push origin HEAD:brand/softly-complete-identity
          fi
