<div class="services-showcase-hero editorial-showcase-hero editorial-showcase--{{KIND}}" aria-labelledby="editorial-showcase-title">
  <div class="services-showcase-editorial">
    <div class="services-showcase-edition">
      <span><span class="services-showcase-asterisk" aria-hidden="true">✳</span> {{EDITION_LABEL}}</span>
      <span>SOFTLY / SHOWCASE</span>
    </div>
    <div class="services-showcase-message">
      <span class="services-showcase-kicker">{{KICKER}}</span>
      <h1 id="editorial-showcase-title">{{TITLE}}</h1>
      <p>{{DESCRIPTION}}</p>
      <div class="services-showcase-actions">
        <a class="services-showcase-primary" href="{{PRIMARY_URL}}">{{PRIMARY_LABEL}} <span aria-hidden="true">↘</span></a>
        <a class="services-showcase-secondary" href="{{SECONDARY_URL}}">{{SECONDARY_LABEL}} <span aria-hidden="true">↗</span></a>
      </div>
    </div>
    <div class="services-showcase-colophon">
      <span>{{FOOTNOTE}}</span>
      <span>EXPLORE BELOW <span aria-hidden="true">↓</span></span>
    </div>
  </div>
  <div class="services-showcase-board">
    <div class="services-board-heading">
      <span>{{BOARD_LABEL}}</span><span aria-hidden="true">↗</span>
    </div>
    <p class="services-board-intro">{{BOARD_TITLE}}</p>
    <nav aria-label="{{NAV_LABEL}}">
      <ol class="services-board-list">{{BOARD_ITEMS}}</ol>
    </nav>
    <div class="services-board-footer"><span>GOOD DESIGN MOVES FORWARD</span><span aria-hidden="true">✳</span></div>
  </div>
</div>
