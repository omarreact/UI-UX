<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#120807">
  <meta name="color-scheme" content="light">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <link rel="canonical" href="{{CANONICAL}}">
  <meta name="application-name" content="Softly Solutions">
  <meta name="apple-mobile-web-app-title" content="Softly">
  <meta property="og:site_name" content="Softly Solutions">
  <meta property="og:image" content="https://agency.pincodeit.com/assets/brand/social-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Softly Solutions — Ideas with intention, independent design showcase">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="https://agency.pincodeit.com/assets/brand/social-card.png">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/mark.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"Softly Solutions — Independent Design Showcase","url":"https://agency.pincodeit.com/","description":"An original creative identity and design-showcase concept."}</script>
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
  <link rel="stylesheet" href="/assets/css/brand.css">
  <script type="module" src="/assets/js/site.js"></script>
  <script type="module" src="/assets/js/router.js"></script>
</head>
<body data-page="{{PAGE_ID}}">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="scroll-progress" aria-hidden="true"></div>
  <header class="top-shell" id="top">
    <div class="hero {{HERO_CLASS}}">
      {{NAV}}
      {{HERO}}
    </div>
  </header>
  <main id="main-content">
    {{BODY}}
  </main>
  <a class="back-to-top" href="#top" aria-label="Back to top" title="Back to top">↑</a>
  {{FOOTER}}
</body>
</html>
